name: Build jar
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Compilar
        run: |
          mkdir -p bin
          javac -nowarn -d bin -sourcepath src src/Graphwar/*.java src/GraphServer/*.java src/GlobalServer/*.java src/RoomServer/*.java
          jar cfe graphwar-web.jar Graphwar.Graphwar -C bin Graphwar -C bin GraphServer rsc
      - name: Guardar jar
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add graphwar-web.jar
          git commit -m "Build graphwar-web.jar" || echo "sin cambios"
          git push
