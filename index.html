<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GraphWar</title>
<style>
html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
#container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div id="container"></div>
<script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
<script type="module">
// URL de TU proxy WebSocket (debe ser wss://, sin barra final). Ejemplo: "wss://graphwar-proxy.onrender.com"
const WS_PROXY = "wss://CAMBIA-ESTO.example.com";

// ---- Transporte WebSocket para GraphServer.WebTransport (ver src/GraphServer/WebTransport.java) ----
const conns = new Map();
let nextId = 1;

async function Java_GraphServer_WebTransport_open(lib, url) {
  return new Promise((resolve) => {
    let ws;
    try { ws = new WebSocket(url); } catch (e) { resolve(-1); return; }
    const id = nextId++;
    const c = { ws, queue: [], waiter: null, closed: false };
    const wake = () => { if (c.waiter) { const w = c.waiter; c.waiter = null; w(); } };
    const timer = setTimeout(() => { try { ws.close(); } catch (e) {} resolve(-1); }, 10000);
    ws.onopen = () => { clearTimeout(timer); conns.set(id, c); resolve(id); };
    ws.onmessage = (ev) => { c.queue.push(String(ev.data)); wake(); };
    ws.onclose = () => { clearTimeout(timer); c.closed = true; wake(); if (!conns.has(id)) resolve(-1); };
    ws.onerror = () => {};
  });
}

async function Java_GraphServer_WebTransport_recv(lib, id, timeoutMs) {
  const c = conns.get(id);
  if (!c) return "C";
  if (c.queue.length === 0 && !c.closed) {
    await new Promise((res) => {
      const t = setTimeout(() => { c.waiter = null; res(); }, timeoutMs);
      c.waiter = () => { clearTimeout(t); res(); };
    });
  }
  if (c.queue.length > 0) return "L" + c.queue.shift();
  return c.closed ? "C" : "T";
}

async function Java_GraphServer_WebTransport_send(lib, id, line) {
  const c = conns.get(id);
  if (!c || c.closed || c.ws.readyState !== 1) return 0;
  c.ws.send(line);
  return 1;
}

async function Java_GraphServer_WebTransport_close(lib, id) {
  const c = conns.get(id);
  if (!c) return;
  conns.delete(id);
  c.closed = true;
  try { c.ws.close(); } catch (e) {}
  if (c.waiter) { const w = c.waiter; c.waiter = null; w(); }
}

await cheerpjInit({
  javaProperties: ["graphwar.ws=" + WS_PROXY],
  natives: {
    Java_GraphServer_WebTransport_open,
    Java_GraphServer_WebTransport_recv,
    Java_GraphServer_WebTransport_send,
    Java_GraphServer_WebTransport_close,
  },
});
cheerpjCreateDisplay(-1, -1, document.getElementById("container"));
await cheerpjRunJar("/app/graphwar-web/graphwar-web.jar");
</script>
</body>
</html>
